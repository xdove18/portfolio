<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    

    <!-- Путь к значку обязательно с косой чертой в начале.
         Без неё браузер ищет файл рядом с текущей страницей:
         на кейсе /projects/habits это был бы адрес
         /projects/favicon.svg — такого файла нет, и значок
         во вкладке пропадал. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ==========================================================
         СВЕТЛАЯ ИЛИ ТЁМНАЯ ТЕМА
         ==========================================================
         Этот кусочек кода выполняется до того, как страница
         нарисуется. Он ставит пометку о выбранной теме, и сайт
         сразу открывается в нужных цветах.

         Без него при каждом заходе на долю секунды мелькала бы
         светлая тема, и только потом включалась тёмная.

         Сами цвета лежат в src/styles/variables.css — здесь
         только пометка.
         ========================================================== -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var выбор = localStorage.getItem("theme");
          if (выбор) document.documentElement.dataset.theme = выбор;
        } catch (e) {
          /* в режиме инкогнито чтение может быть запрещено —
             тогда просто берётся настройка системы */
        }
      })();
    </script>

    <!-- ==========================================================
         ЗАГОЛОВОК И ОПИСАНИЕ ДЛЯ ПОИСКОВИКОВ
         Это то, что видно в результатах поиска Google и Яндекса,
         и в превью ссылки, когда её кидают в мессенджер.
         Меняйте текст прямо здесь.
         ========================================================== -->
    <title>Лиза Иванова — продуктовый дизайнер</title>
    <meta
      name="description"
      content="Портфолио продуктового дизайнера. Проектирую веб- и мобильные продукты для B2B и B2C — от исследования и гипотез до интерфейса, который растит конверсию."
    />

    <!-- Превью ссылки в Telegram, ВКонтакте и других соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Лиза Иванова — продуктовый дизайнер" />
    <meta
      property="og:description"
      content="Портфолио продуктового дизайнера: кейсы по B2B и B2C — CRM, подбор размера, чекаут, трекер привычек."
    />
    <!-- Картинка превью ссылки — та, что видно, когда ссылку
         кидают в Telegram или ВКонтакте.

         Здесь обязательно ПОЛНЫЙ адрес, начиная с https://.
         Короткий вида /images/me.webp соцсети не понимают,
         и картинка в превью просто не появится.

         Сейчас указан ваш домен xdovee.ru. Если домен
         поменяется — поправьте начало адреса здесь.
         Свою картинку можно положить в папку public/. -->
    <meta
      property="og:image"
      content="https://xdovee.ru/images/me.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Цвет адресной строки на телефоне -->
    <meta name="theme-color" content="#f8f6f3" />

    <!-- ==========================================================
         ДАННЫЕ ДЛЯ ПОИСКОВИКОВ В МАШИННОМ ВИДЕ
         Помогает Google понять, что это портфолио человека.
         ========================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Лиза Иванова",
        "jobTitle": "Продуктовый дизайнер",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Самара",
          "addressCountry": "RU"
        },
        "sameAs": ["https://t.me/xdovee"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
