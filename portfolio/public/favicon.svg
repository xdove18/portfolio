<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Иконка сайта во вкладке браузера: та же ромашка,
       что и на страницах, на молочном фоне сайта.
       Чтобы поменять цвет цветка, замените #f5352a ниже. -->
  <rect width="100" height="100" rx="22" fill="#f8f6f3"/>

  <!-- Маска вырезает белую серединку цветка -->
  <mask id="hole">
    <rect width="100" height="100" fill="#fff"/>
    <circle cx="50" cy="50" r="10" fill="#000"/>
  </mask>

  <g fill="#f5352a" mask="url(#hole)">
    <!-- Девять лепестков, расставленных по кругу -->
    <ellipse cx="50" cy="27" rx="11" ry="19"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(40 50 50)"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(80 50 50)"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(120 50 50)"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(160 50 50)"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(200 50 50)"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(240 50 50)"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(280 50 50)"/>
    <ellipse cx="50" cy="27" rx="11" ry="19" transform="rotate(320 50 50)"/>
    <!-- Сердцевина: соединяет лепестки в цельную фигуру -->
    <circle cx="50" cy="50" r="21"/>
  </g>
</svg>
